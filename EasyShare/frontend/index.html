<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyShare - 文件共享</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📁 EasyShare</h1>
        <div class="header-actions">
            <button id="uploadBtn">📤 上传文件</button>
            <button id="mkdirBtn">📁 创建文件夹</button>
            <button id="pasteBtn">📋 粘贴</button>
            <button id="batchBtn" class="mobile-only">✓ 批量选择</button>
            <button id="deleteBtn" class="danger" style="display: none;">🗑️ 删除选中 (0)</button>
        </div>
    </header>

    <nav id="breadcrumb">
        <span class="crumb" data-path=".">🏠 根目录</span>
    </nav>

    <main>
        <div id="fileList" class="file-grid">
            <!-- 文件列表将动态生成 -->
        </div>
    </main>

    <input type="file" id="fileInput" multiple style="display: none;">
    
    <div id="mkdirModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>创建文件夹</h3>
            <input type="text" id="dirName" placeholder="输入文件夹名称">
            <button id="confirmMkdir">确定</button>
        </div>
    </div>

    <div id="pasteModal" class="modal">
        <div class="modal-content">
            <span class="close" id="pasteModalClose">&times;</span>
            <h3>📋 粘贴内容</h3>
            <input type="text" id="pasteFileName" placeholder="输入文件名（默认自动生成）">
            <textarea id="pasteContent" placeholder="在此粘贴内容（按 Ctrl+V 或右键粘贴）"></textarea>
            <div class="modal-actions">
                <button id="confirmPaste">保存文件</button>
                <button id="cancelPaste">取消</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
