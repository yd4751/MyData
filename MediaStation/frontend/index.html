<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MediaStation - 探索自然之美</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        
        .logo-icon {
            color: #1a73e8;
            font-size: 2rem;
            font-weight: bold;
        }
        
        .logo-text {
            font-size: 1.8rem;
            font-weight: 600;
        }
        
        .loading-text {
            font-size: 1rem;
            color: #999999;
            margin-bottom: 1rem;
        }
        
        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1a73e8, #4285f4);
            border-radius: 2px;
            animation: loading 1.5s ease-in-out infinite;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .device-info {
            position: fixed;
            bottom: 1rem;
            font-size: 0.8rem;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">MediaStation</span>
    </div>
    <div class="loading-text">正在检测设备...</div>
    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>
    <div class="device-info" id="deviceInfo"></div>

    <script>
        function detectDevice() {
            const userAgent = navigator.userAgent.toLowerCase();
            
            const mobileKeywords = [
                'iphone', 'ipad', 'ipod', 'android', 'blackberry',
                'windows phone', 'mobile', 'tablet'
            ];
            
            const isMobile = mobileKeywords.some(keyword => userAgent.includes(keyword));
            const screenWidth = window.innerWidth;
            const isSmallScreen = screenWidth < 768;
            
            return isMobile || isSmallScreen;
        }
        
        function redirect() {
            const isMobile = detectDevice();
            const deviceInfo = document.getElementById('deviceInfo');
            
            if (isMobile) {
                deviceInfo.textContent = '检测到移动设备，正在跳转到移动端...';
                setTimeout(() => {
                    window.location.href = 'mobile/index.html';
                }, 500);
            } else {
                deviceInfo.textContent = '检测到桌面设备，正在跳转到PC端...';
                setTimeout(() => {
                    window.location.href = 'pc/index.html';
                }, 500);
            }
        }
        
        document.addEventListener('DOMContentLoaded', redirect);
        
        window.addEventListener('resize', () => {
            const currentPath = window.location.pathname;
            if (!currentPath.includes('mobile') && !currentPath.includes('pc')) {
                redirect();
            }
        });
    </script>
</body>
</html>
