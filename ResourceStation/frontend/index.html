<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源管理存储站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-blur: blur(20px);
            --primary-glow: rgba(67, 97, 238, 0.5);
            --success-color: #4ade80;
            --warning-color: #f97316;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e4e4e7;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 20% 20%, rgba(67, 97, 238, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .navbar {
            background: rgba(255, 255, 255, 0.08) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
        }

        .navbar-nav .nav-link {
            color: #e4e4e7 !important;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            margin: 0 4px;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar-nav .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff !important;
        }

        .navbar-nav .nav-link.active {
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.3) 0%, rgba(168, 85, 247, 0.3) 100%);
            color: #fff !important;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: #fff !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-brand i {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 8px rgba(67, 97, 238, 0.8));
        }

        .container {
            max-width: 1400px;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 60px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: rgba(67, 97, 238, 0.6);
            background: rgba(67, 97, 238, 0.08);
            transform: scale(1.02);
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(67, 97, 238, 0.2) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .upload-area:hover::before {
            opacity: 1;
        }

        .upload-area i {
            font-size: 80px;
            color: rgba(67, 97, 238, 0.8);
            margin-bottom: 20px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 15px rgba(67, 97, 238, 0.6));
        }

        .upload-area:hover i {
            color: #4361ee;
            transform: translateY(-10px) scale(1.1);
            filter: drop-shadow(0 0 25px rgba(67, 97, 238, 0.8));
        }

        .upload-area h5 {
            color: #e4e4e7;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.25rem;
        }

        .upload-area p {
            color: #9ca3af;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4361ee 0%, #7209b7 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 28px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(67, 97, 238, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(67, 97, 238, 0.6);
        }

        .btn-outline-primary {
            border-color: rgba(67, 97, 238, 0.6);
            color: #4361ee;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: transparent;
        }

        .btn-outline-primary:hover {
            background: rgba(67, 97, 238, 0.1);
            border-color: #4361ee;
            transform: translateY(-2px);
        }

        .btn-outline-danger {
            border-radius: 12px;
            border-color: rgba(239, 68, 68, 0.6);
            color: #ef4444;
            transition: all 0.3s ease;
            background: transparent;
        }

        .btn-outline-danger:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            transform: translateY(-2px);
        }

        .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.3);
            color: #e4e4e7;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: transparent;
        }

        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #e4e4e7;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: rgba(67, 97, 238, 0.6);
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.15);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-control::placeholder {
            color: #6b7280;
        }

        .form-label {
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        .form-check-input {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .form-check-input:checked {
            background: #4361ee;
            border-color: #4361ee;
        }

        .nav-tabs .nav-link {
            border-radius: 10px 10px 0 0;
            font-weight: 500;
            color: #9ca3af;
            background: transparent;
            border: none;
            transition: all 0.3s ease;
        }

        .nav-tabs .nav-link.active {
            background: rgba(67, 97, 238, 0.15);
            color: #4361ee;
            font-weight: 600;
            border-bottom: 2px solid #4361ee;
        }

        .table {
            background: transparent;
        }

        .table thead th {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            color: #d1d5db;
            padding: 1rem;
        }

        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #e4e4e7;
        }

        .table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .pagination .page-link {
            border-radius: 10px;
            margin: 0 4px;
            border: none;
            color: #9ca3af;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .pagination .page-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateY(-2px);
        }

        .pagination .page-item.active .page-link {
            background: linear-gradient(135deg, #4361ee 0%, #7209b7 100%);
            color: #fff;
            border: none;
        }

        .progress {
            height: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
            border-radius: 10px;
        }

        .modal-content {
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 0 0;
            color: #fff;
        }

        .modal-title {
            font-weight: 600;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .badge-success {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .badge-warning {
            background: rgba(249, 115, 22, 0.2);
            color: #f97316;
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .badge-secondary {
            background: rgba(156, 163, 175, 0.2);
            color: #9ca3af;
        }

        .toast {
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 0 0 !important;
            padding: 1.2rem 1.5rem;
            font-weight: 600;
            font-size: 1.1rem;
            color: #e4e4e7;
        }

        .card-header i {
            margin-right: 10px;
            color: #4361ee;
        }

        .card-body {
            padding: 1.8rem;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(67, 97, 238, 0.4);
            transform: translateY(-3px);
        }

        .file-icon {
            font-size: 28px;
            margin-right: 15px;
            color: #4361ee;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #e4e4e7;
            margin-bottom: 5px;
        }

        .file-meta {
            display: flex;
            gap: 15px;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .login-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .file-preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .file-preview-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .file-preview-card:hover {
            border-color: rgba(67, 97, 238, 0.5);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
        }

        .file-preview-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .file-preview-thumbnail-container {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            overflow: hidden;
            border: 2px dashed rgba(255, 255, 255, 0.1);
        }

        .file-preview-thumbnail {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .file-preview-icon {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            font-size: 48px;
            color: #4361ee;
        }

        .file-preview-info {
            width: 100%;
        }

        .file-preview-name {
            font-weight: 600;
            color: #e4e4e7;
            margin-bottom: 8px;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-preview-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .file-preview-type {
            background: rgba(67, 97, 238, 0.15);
            color: #4361ee;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .file-preview-size {
            color: #9ca3af;
        }

        .file-preview-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            opacity: 0.7;
            transition: all 0.3s ease;
            background: rgba(239, 68, 68, 0.2);
            border: none;
            color: #ef4444;
        }

        .file-preview-remove:hover {
            opacity: 1;
            transform: scale(1.1);
            background: rgba(239, 68, 68, 0.3);
        }

        .navbar-text {
            color: #e4e4e7 !important;
        }

        @media (max-width: 768px) {
            .card-body {
                padding: 1.2rem;
            }

            .upload-area {
                padding: 40px 20px;
            }

            .upload-area i {
                font-size: 56px;
            }

            .navbar-brand {
                font-size: 1.2rem;
            }

            .navbar-nav .nav-link {
                padding: 0.5rem 1rem;
            }

            .file-preview-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }

            .file-preview-thumbnail-container,
            .file-preview-icon {
                width: 100px;
                height: 100px;
            }

            .file-preview-icon {
                font-size: 36px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(67, 97, 238, 0.6) 0%, rgba(168, 85, 247, 0.6) 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #4361ee 0%, #a855f7 100%);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-cloud-arrow-up-fill"></i> 资源管理存储站
            </a>
            <div class="navbar-nav" id="nav-items">
                <a class="nav-link active" href="#" id="home-nav"><i class="bi bi-house"></i> 首页</a>
                <a class="nav-link" href="#" id="category-nav"><i class="bi bi-grid-3x3"></i> 分类</a>
                <a class="nav-link" href="#" id="resources-nav"><i class="bi bi-folder-open"></i> 我的资源</a>
                <a class="nav-link" href="#" id="settings-nav"><i class="bi bi-gear"></i> 设置</a>
            </div>
            <div class="navbar-nav ms-auto" id="auth-buttons">
            </div>
        </div>
    </nav>

    <div class="container mt-6" id="main-content">
        <div id="auth-forms" class="d-none">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="glass-card">
                        <div class="card-header">
                            <ul class="nav nav-tabs card-header-tabs" id="auth-tabs">
                                <li class="nav-item">
                                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login">登录</button>
                                </li>
                                <li class="nav-item">
                                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register">注册</button>
                                </li>
                            </ul>
                        </div>
                        <div class="card-body">
                            <div class="tab-content">
                                <div class="tab-pane fade show active" id="login">
                                    <form id="login-form">
                                        <div class="mb-3">
                                            <label for="login-username" class="form-label">用户名</label>
                                            <input type="text" class="form-control" id="login-username" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="login-password" class="form-label">密码</label>
                                            <input type="password" class="form-control" id="login-password" required>
                                        </div>
                                        <button type="submit" class="btn btn-primary w-100">登录</button>
                                    </form>
                                </div>
                                <div class="tab-pane fade" id="register">
                                    <form id="register-form">
                                        <div class="mb-3">
                                            <label for="register-username" class="form-label">用户名</label>
                                            <input type="text" class="form-control" id="register-username" required minlength="3" maxlength="50">
                                        </div>
                                        <div class="mb-3">
                                            <label for="register-email" class="form-label">邮箱</label>
                                            <input type="email" class="form-control" id="register-email" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="register-password" class="form-label">密码</label>
                                            <input type="password" class="form-control" id="register-password" required minlength="6">
                                        </div>
                                        <button type="submit" class="btn btn-primary w-100">注册</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="resource-manager" class="d-none">
            <div class="row">
                <div class="col-md-3">
                    <div class="glass-card">
                        <div class="card-header">
                            <i class="bi bi-person-circle"></i> 用户信息
                        </div>
                        <div class="card-body">
                            <div id="user-info">
                            </div>
                            <button class="btn btn-outline-danger w-100 mt-3" id="logout-btn">
                                <i class="bi bi-box-arrow-right"></i> 退出登录
                            </button>
                        </div>
                    </div>

                    <div class="glass-card mt-3">
                        <div class="card-header">
                            <i class="bi bi-upload"></i> 上传文件
                        </div>
                        <div class="card-body">
                            <div class="upload-area" id="upload-area">
                                <i class="bi bi-cloud-arrow-up"></i>
                                <h5>上传资源</h5>
                                <p class="text-muted">拖放文件到此处或点击选择</p>
                                <input type="file" id="file-input" class="d-none" multiple>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="is-public">
                                <label class="form-check-label" for="is-public">
                                    设为公开
                                </label>
                            </div>
                            <div class="form-group mb-3">
                                <label for="file-description" class="form-label">文件描述</label>
                                <textarea class="form-control" id="file-description" rows="2" placeholder="可选的文件描述"></textarea>
                            </div>
                            <div class="form-group mb-3">
                                <label for="file-tags" class="form-label">标签</label>
                                <input type="text" class="form-control" id="file-tags" placeholder="用逗号分隔的标签">
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="enable-chunking">
                                <label class="form-check-label" for="enable-chunking">
                                    启用分片上传（大文件推荐）
                                </label>
                            </div>
                            <button class="btn btn-primary w-100" id="start-upload">
                                <i class="bi bi-upload"></i> 开始上传
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-md-9">
                    <div class="glass-card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-folder"></i> 我的资源</span>
                            <div>
                                <input type="text" class="form-control form-control-sm" id="search-input" placeholder="搜索资源..." style="width: 200px; display: inline-block;">
                                <button class="btn btn-sm btn-outline-primary ms-2" id="refresh-btn">
                                    <i class="bi bi-arrow-clockwise"></i> 刷新
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>文件名</th>
                                            <th>类型</th>
                                            <th>大小</th>
                                            <th>状态</th>
                                            <th>上传时间</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="resource-table">
                                    </tbody>
