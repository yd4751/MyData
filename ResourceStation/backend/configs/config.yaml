server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug" # debug, release, test

database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "12345678"
  database: "resource_station"
  charset: "utf8mb4"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600 # seconds

jwt:
  secret: "your-secret-key-change-in-production"
  expire_hours: 24

storage:
  base_path: "./storage"
  temp_path: "./temp"
  max_file_size: 1099511627776 # 1TB in bytes
  chunk_size: 10485760 # 10MB chunk size for resumable uploads
  allowed_types:
    - "text/*"
    - "image/*"
    - "video/*"
    - "audio/*"
    - "application/pdf"
    - "application/zip"

upload:
  max_concurrent_uploads: 5
  cleanup_temp_files: true
  temp_file_expiry: 3600 # seconds

logging:
  level: "info" # debug, info, warn, error
  output: "stdout" # stdout, file
  file_path: "./logs/app.log"
