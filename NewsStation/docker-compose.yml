version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: geonews-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: geonews
      MYSQL_USER: geonews
      MYSQL_PASSWORD: geonews123
    ports:
      - "7077:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: .
    container_name: geonews-api
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=12345678
      - DATABASE_NAME=geonews
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./config:/app/config

volumes:
  mysql-data: