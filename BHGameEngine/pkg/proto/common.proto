syntax = "proto3";

package proto;

option go_package = "./pkg/proto";

message Vector3 {
    double x = 1;
    double y = 2;
    double z = 3;
}

message PlayerInfo {
    int64 player_id = 1;
    string name = 2;
    int32 level = 3;
    Vector3 position = 4;
    float rotation = 5;
    int32 health = 6;
    int32 max_health = 7;
    int32 mana = 8;
    int32 max_mana = 9;
    int32 stamina = 10;
    int32 max_stamina = 11;
    int32 state = 12;
}

message EntityInfo {
    int64 entity_id = 1;
    int32 entity_type = 2;
    string name = 3;
    Vector3 position = 4;
    float rotation = 5;
    int32 health = 6;
    int32 max_health = 7;
    int32 state = 8;
    int32 level = 9;
}

message ChunkInfo {
    int32 chunk_x = 1;
    int32 chunk_y = 2;
    bool loaded = 3;
    bool active = 4;
}

message LoginRequest {
    string account = 1;
    string password = 2;
    string device_id = 3;
}

message LoginResponse {
    int32 result = 1;
    string session_id = 2;
    PlayerInfo player_info = 3;
    repeated string servers = 4;
}

message EnterWorldRequest {
    string session_id = 1;
    int64 player_id = 2;
    Vector3 position = 3;
}

message EnterWorldResponse {
    int32 result = 1;
    repeated ChunkInfo chunks = 2;
    repeated EntityInfo entities = 3;
}

message MoveRequest {
    int64 player_id = 1;
    Vector3 position = 2;
    float rotation = 3;
}

message MoveResponse {
    int32 result = 1;
    Vector3 position = 2;
}

message SkillRequest {
    int64 player_id = 1;
    int32 skill_id = 2;
    int64 target_id = 3;
}

message SkillResponse {
    int32 result = 1;
    int32 damage = 2;
}

message ChatRequest {
    int64 player_id = 1;
    int32 channel = 2;
    string content = 3;
}

message ChatResponse {
    int32 result = 1;
}

message ChatBroadcast {
    int64 player_id = 1;
    string player_name = 2;
    int32 channel = 3;
    string content = 4;
}

message EntitySync {
    repeated EntityInfo entities = 1;
}

message PlayerSync {
    repeated PlayerInfo players = 1;
}

message ChunkLoad {
    repeated ChunkInfo chunks = 1;
}

message ChunkUnload {
    repeated ChunkInfo chunks = 1;
}

message ErrorResponse {
    int32 error_code = 1;
    string error_message = 2;
}

message Ping {
    int64 timestamp = 1;
}

message Pong {
    int64 timestamp = 1;
}

message ItemInfo {
    int64 item_id = 1;
    string name = 2;
    int32 category = 3;
    int32 sub_type = 4;
    int32 rarity = 5;
    int32 level = 6;
    int32 count = 7;
    int32 slot = 8;
    string uid = 9;
}

message EquipmentInfo {
    int32 slot = 1;
    int64 item_id = 2;
    string item_name = 3;
    int32 level = 4;
}

message InventoryInfo {
    int64 owner_id = 1;
    int64 gold = 2;
    int32 capacity = 3;
    repeated ItemInfo items = 4;
    repeated EquipmentInfo equipments = 5;
}

message AddItemRequest {
    int64 player_id = 1;
    int64 item_id = 2;
    int32 count = 3;
}

message AddItemResponse {
    int32 result = 1;
    string message = 2;
}

message RemoveItemRequest {
    int64 player_id = 1;
    int32 slot = 2;
    int32 count = 3;
}

message RemoveItemResponse {
    int32 result = 1;
    string message = 2;
}

message UseItemRequest {
    int64 player_id = 1;
    int32 slot = 2;
}

message UseItemResponse {
    int32 result = 1;
    string message = 2;
}

message EquipItemRequest {
    int64 player_id = 1;
    int32 slot = 2;
}

message EquipItemResponse {
    int32 result = 1;
    string message = 2;
}

message UnequipItemRequest {
    int64 player_id = 1;
    int32 slot = 2;
}

message UnequipItemResponse {
    int32 result = 1;
    string message = 2;
}

message GetInventoryRequest {
    int64 player_id = 1;
}

message GetInventoryResponse {
    int32 result = 1;
    InventoryInfo inventory = 2;
}

message TradeRequest {
    int64 player_id = 1;
    int64 target_id = 2;
}

message TradeResponse {
    int32 result = 1;
    int64 trade_id = 2;
    string message = 3;
}

message TradeAddItemRequest {
    int64 trade_id = 1;
    int64 player_id = 2;
    int64 item_id = 3;
    int32 count = 4;
}

message TradeSetGoldRequest {
    int64 trade_id = 1;
    int64 player_id = 2;
    int64 gold = 3;
}

message TradeAcceptRequest {
    int64 trade_id = 1;
    int64 player_id = 2;
}

message TradeCancelRequest {
    int64 trade_id = 1;
    int64 player_id = 2;
}

message CraftRequest {
    int64 player_id = 1;
    int64 recipe_id = 2;
}

message CraftResponse {
    int32 result = 1;
    string message = 2;
}

service GateService {
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc EnterWorld(EnterWorldRequest) returns (EnterWorldResponse);
    rpc Move(MoveRequest) returns (MoveResponse);
    rpc Skill(SkillRequest) returns (SkillResponse);
    rpc Chat(ChatRequest) returns (ChatResponse);
    rpc AddItem(AddItemRequest) returns (AddItemResponse);
    rpc RemoveItem(RemoveItemRequest) returns (RemoveItemResponse);
    rpc UseItem(UseItemRequest) returns (UseItemResponse);
    rpc EquipItem(EquipItemRequest) returns (EquipItemResponse);
    rpc UnequipItem(UnequipItemRequest) returns (UnequipItemResponse);
    rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse);
    rpc Trade(TradeRequest) returns (TradeResponse);
    rpc Craft(CraftRequest) returns (CraftResponse);
}

service GridMapService {
    rpc GetChunks(EnterWorldRequest) returns (ChunkLoad);
    rpc UpdatePlayerPosition(MoveRequest) returns (MoveResponse);
    rpc GetEntities(EnterWorldRequest) returns (EntitySync);
}

service BattleService {
    rpc ProcessSkill(SkillRequest) returns (SkillResponse);
}

service CrossService {
    rpc GetCrossServerPlayers(EnterWorldRequest) returns (PlayerSync);
}

service DataService {
    rpc SavePlayerData(PlayerInfo) returns (ErrorResponse);
    rpc LoadPlayerData(LoginRequest) returns (PlayerInfo);
    rpc SaveInventory(InventoryInfo) returns (ErrorResponse);
    rpc LoadInventory(GetInventoryRequest) returns (InventoryInfo);
}