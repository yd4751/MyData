<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务日志监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-right {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        
        .filter-bar {
            padding: 20px 30px;
            background: rgba(0,0,0,0.2);
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-label {
            font-size: 14px;
            color: #aaa;
        }
        
        select, input {
            padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        select:focus, input:focus {
            border-color: #00d4ff;
        }
        
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        
        .log-container {
            padding: 20px 30px;
            height: calc(100vh - 200px);
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.1s;
        }
        
        .log-entry:hover {
            background: rgba(255,255,255,0.03);
        }
        
        .log-timestamp {
            color: #666;
            margin-right: 15px;
        }
        
        .log-level {
            display: inline-block;
            width: 50px;
            text-align: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 10px;
        }
        
        .log-level.TRACE { color: #94a3b8; background: rgba(148, 163, 184, 0.2); }
        .log-level.DEBUG { color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        .log-level.INFO { color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .log-level.WARN { color: #f59e0b; background: rgba(245, 158, 11, 0.2); }
        .log-level.ERROR { color: #ef4444; background: rgba(239, 68, 68, 0.2); }
        .log-level.FATAL { color: #dc2626; background: rgba(220, 38, 38, 0.2); }
        
        .log-service {
            display: inline-block;
            width: 80px;
            text-align: left;
            margin-right: 15px;
            font-weight: 500;
        }
        
        .log-message {
            color: #ccc;
        }
        
        .stats-bar {
            padding: 10px 30px;
            background: rgba(0,0,0,0.2);
            display: flex;
            gap: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
        }
        
        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #00d4ff;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-dot.disconnected {
            background: #ef4444;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📜 服务日志监控</h1>
        <div class="header-right">
            <button class="btn btn-primary" onclick="refreshLogs()">🔄 刷新</button>
            <button class="btn btn-danger" onclick="clearLogs()">🗑️ 清空</button>
        </div>
    </div>
    
    <div class="filter-bar">
        <div class="filter-group">
            <span class="filter-label">服务:</span>
            <select id="serviceFilter" onchange="refreshLogs()">
                <option value="">所有服务</option>
                <option value="gate">gate</option>
                <option value="login">login</option>
                <option value="logic">logic</option>
                <option value="battle">battle</option>
                <option value="gridmap">gridmap</option>
                <option value="cross">cross</option>
                <option value="dataservice">dataservice</option>
                <option value="gm">gm</option>
                <option value="webserver">webserver</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">级别:</span>
            <select id="levelFilter" onchange="refreshLogs()">
                <option value="">所有级别</option>
                <option value="trace">TRACE</option>
                <option value="debug">DEBUG</option>
                <option value="info">INFO</option>
                <option value="warn">WARN</option>
                <option value="error">ERROR</option>
                <option value="fatal">FATAL</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">搜索:</span>
            <input type="text" id="searchInput" placeholder="搜索日志内容..." onkeyup="filterLogs()">
        </div>
        <div class="filter-group">
            <span class="status-dot" id="streamStatus"></span>
            <span class="filter-label">实时流: <span id="streamStatusText">连接中...</span></span>
        </div>
    </div>
    
    <div class="log-container" id="logContainer">
        <div style="text-align: center; color: #666; padding: 50px;">加载日志中...</div>
    </div>
    
    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">日志总数:</span>
            <span class="stat-value" id="totalCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">服务数:</span>
            <span class="stat-value" id="serviceCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">错误数:</span>
            <span class="stat-value" style="color: #ef4444;" id="errorCount">0</span>
        </div>
    </div>

    <script>
        let eventSource = null;
        let allLogs = [];
        
        function refreshLogs() {
            const service = document.getElementById('serviceFilter').value;
            const level = document.getElementById('levelFilter').value;
            
            let url = '/api/logs';
            const params = [];
            if (service) params.push(`service=${service}`);
            if (level) params.push(`level=${level}`);
            if (params.length > 0) url += '?' + params.join('&');
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    allLogs = data;
                    displayLogs(data);
                    updateStats(data);
                })
                .catch(error => console.error('Failed to fetch logs:', error));
        }
        
        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
            allLogs = [];
            updateStats([]);
        }
        
        function filterLogs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const service = document.getElementById('serviceFilter').value;
            const level = document.getElementById('levelFilter').value;
            
            let filtered = allLogs;
            
            if (service) {
                filtered = filtered.filter(log => log.service === service);
            }
            if (level) {
                filtered = filtered.filter(log => log.level.toLowerCase() === level.toLowerCase());
            }
            if (searchTerm) {
                filtered = filtered.filter(log => 
                    log.message.toLowerCase().includes(searchTerm) ||
                    log.service.toLowerCase().includes(searchTerm)
                );
            }
            
            displayLogs(filtered);
        }
        
        function displayLogs(logs) {
            const container = document.getElementById('logContainer');
            
            if (logs.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666; padding: 50px;">暂无日志</div>';
                return;
            }
            
            const serviceColors = {
                'gate': '#f97316',
                'login': '#22c55e',
                'logic': '#8b5cf6',
                'battle': '#ef4444',
                'gridmap': '#14b8a6',
                'cross': '#f59e0b',
                'dataservice': '#6366f1',
                'gm': '#ec4899',
                'webserver': '#10b981'
            };
            
            container.innerHTML = logs.map(log => {
                const serviceColor = serviceColors[log.service] || '#00d4ff';
                const level = log.level.toUpperCase();
                return `
                    <div class="log-entry">
                        <span class="log-timestamp">${log.timestamp}</span>
                        <span class="log-level ${level}">${level}</span>
                        <span class="log-service" style="color: ${serviceColor};">${log.service}</span>
                        <span class="log-message">${escapeHtml(log.message)}</span>
                    </div>
                `;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
        }
        
        function updateStats(logs) {
            document.getElementById('totalCount').textContent = logs.length;
            
            const services = new Set(logs.map(log => log.service));
            document.getElementById('serviceCount').textContent = services.size;
            
            const errors = logs.filter(log => 
                log.level === 'error' || log.level === 'fatal'
            );
            document.getElementById('errorCount').textContent = errors.length;
        }
        
        function startLogStream() {
            if (eventSource) {
                eventSource.close();
            }
            
            const service = document.getElementById('serviceFilter').value;
            const level = document.getElementById('levelFilter').value;
            
            let url = '/api/logs/stream';
            const params = [];
            if (service) params.push(`service=${service}`);
            if (level) params.push(`level=${level}`);
            if (params.length > 0) url += '?' + params.join('&');
            
            eventSource = new EventSource(url);
            
            eventSource.onopen = function() {
                document.getElementById('streamStatus').className = 'status-dot';
                document.getElementById('streamStatusText').textContent = '已连接';
                document.getElementById('streamStatusText').style.color = '#22c55e';
            };
            
            eventSource.onmessage = function(event) {
                try {
                    const entry = JSON.parse(event.data);
                    allLogs.push(entry);
                    if (allLogs.length > 5000) {
                        allLogs = allLogs.slice(-5000);
                    }
                    filterLogs();
                } catch (e) {
                    console.error('Failed to parse log entry:', e);
                }
            };
            
            eventSource.onerror = function() {
                document.getElementById('streamStatus').className = 'status-dot disconnected';
                document.getElementById('streamStatusText').textContent = '连接断开';
                document.getElementById('streamStatusText').style.color = '#ef4444';
                eventSource.close();
                setTimeout(startLogStream, 3000);
            };
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.getElementById('serviceFilter').addEventListener('change', function() {
            startLogStream();
        });
        
        document.getElementById('levelFilter').addEventListener('change', function() {
            startLogStream();
        });
        
        window.onload = function() {
            refreshLogs();
            startLogStream();
        };
        
        window.onbeforeunload = function() {
            if (eventSource) {
                eventSource.close();
            }
        };
    </script>
</body>
</html>
